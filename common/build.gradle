architectury {
    common(rootProject.enabled_platforms.split(","))
}

// All mixin classes compile for all versions because:
// - ReloadableRegistriesMixin uses string-based target (compiles without the target class)
// - LootDataManagerMixin uses string-based target
// - IsotopeMixinPlugin handles conditional loading at runtime
// No source exclusions needed - the mixin plugin filters at runtime

dependencies {
    // Fabric loader for annotations - do NOT use other fabric classes here
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // Architectury API
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
