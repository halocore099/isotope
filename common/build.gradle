architectury {
    common("neoforge", "fabric")
}

dependencies {
    // Compat module for version abstraction
    api project(":compat")

    // Fabric loader for annotations (EnvType, Environment) - compile only
    modCompileOnly "net.fabricmc:fabric-loader:0.16.9"
    // Architectury API
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.7.0'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

// Disable standalone transformation - common will be transformed together with compat in neoforge/fabric
tasks.matching { it.name.startsWith('transformProduction') }.configureEach {
    enabled = false
}

test {
    useJUnitPlatform {
        includeTags 'unit'
        excludeTags 'slow', 'integration'
    }
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.register('integrationTest', Test) {
    useJUnitPlatform {
        includeTags 'integration'
    }
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.register('allTests', Test) {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
