plugins {
    id "com.github.johnrengelman.shadow"
}

// Check if neoforge is an enabled platform AND we're on a version that supports it
def enabledPlatforms = rootProject.findProperty("enabled_platforms") ?: ""
def mcVersion = rootProject.findProperty("minecraft_version") ?: "1.21.4"
def isNeoForgeVersion = mcVersion.startsWith("1.21") || mcVersion.startsWith("1.20.4") || mcVersion.startsWith("1.20.5") || mcVersion.startsWith("1.20.6")
def isNeoForgeEnabled = enabledPlatforms.contains("neoforge") && rootProject.hasProperty("neoforge_version") && isNeoForgeVersion

def mcLabel = rootProject.findProperty("minecraft_version_label") ?: mcVersion
archivesBaseName = "isotope-neoforge-${mcLabel}"

if (isNeoForgeEnabled) {
    repositories {
        maven { url "https://maven.neoforged.net/releases/" }
    }

    architectury {
        platformSetupLoomIde()
        neoForge {
        }
    }

    configurations {
        common {
            canBeResolved = true
            canBeConsumed = false
        }
        shadowCommon {
            canBeResolved = true
            canBeConsumed = false
        }
        compileClasspath.extendsFrom common
        runtimeClasspath.extendsFrom common
        developmentNeoForge.extendsFrom common
    }

    def neoforgeVersion = rootProject.findProperty("neoforge_version") ?: "21.4.156"

    dependencies {
        neoForge "net.neoforged:neoforge:${neoforgeVersion}"
        modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"
        common(project(path: ":common", configuration: "namedElements")) { transitive false }
        shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
    }

    processResources {
        inputs.property "version", project.version
        inputs.property "mod_id", rootProject.mod_id
        inputs.property "mod_name", rootProject.mod_name
        inputs.property "mod_description", rootProject.mod_description
        inputs.property "mod_author", rootProject.mod_author
        inputs.property "mod_license", rootProject.mod_license
        inputs.property "neoforge_loader_version", rootProject.findProperty("neoforge_loader_version") ?: "[4,)"
        inputs.property "neoforge_version", rootProject.findProperty("neoforge_version") ?: "21.4.156"
        inputs.property "minecraft_version_range_neoforge", rootProject.findProperty("minecraft_version_range_neoforge") ?: "[1.21,1.22)"
        inputs.property "architectury_min_version", rootProject.findProperty("architectury_min_version") ?: "13.0.0"

        filesMatching("META-INF/neoforge.mods.toml") {
            expand(
                "version": project.version,
                "mod_id": rootProject.mod_id,
                "mod_name": rootProject.mod_name,
                "mod_description": rootProject.mod_description,
                "mod_author": rootProject.mod_author,
                "mod_license": rootProject.mod_license,
                "neoforge_loader_version": rootProject.findProperty("neoforge_loader_version") ?: "[4,)",
                "neoforge_version": rootProject.findProperty("neoforge_version") ?: "21.4.156",
                "minecraft_version_range_neoforge": rootProject.findProperty("minecraft_version_range_neoforge") ?: "[1.21,1.22)",
                "architectury_min_version": rootProject.findProperty("architectury_min_version") ?: "13.0.0"
            )
        }
    }

    shadowJar {
        exclude "architectury.common.json"
        configurations = [project.configurations.shadowCommon]
        archiveClassifier = "dev-shadow"
    }

    remapJar {
        input.set shadowJar.archiveFile
        dependsOn shadowJar
        archiveClassifier = null
    }

    sourcesJar {
        def commonSources = project(":common").sourcesJar
        dependsOn commonSources
        from commonSources.archiveFile.map { zipTree(it) }
    }

    components.java {
        withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
            skip()
        }
    }
} else {
    // For non-NeoForge builds, we need to satisfy Loom's expectations
    // by providing a minimal configuration that doesn't actually do anything

    // Disable all tasks
    tasks.configureEach {
        enabled = false
    }

    // Clear source sets to avoid compilation
    sourceSets {
        main {
            java.srcDirs = []
            resources.srcDirs = []
        }
    }
}
