plugins {
    id "com.github.johnrengelman.shadow"
}

// Check if forge is an enabled platform
def enabledPlatforms = rootProject.findProperty("enabled_platforms") ?: ""
def isForgeEnabled = enabledPlatforms.contains("forge") && rootProject.hasProperty("forge_version")

def mcLabel = rootProject.findProperty("minecraft_version_label") ?: rootProject.minecraft_version
archivesBaseName = "isotope-forge-${mcLabel}"

repositories {
    maven { url "https://maven.minecraftforge.net/" }
}

// Note: Architectury Loom 1.13+ doesn't support old Forge (pre-NeoForge)
// For 1.20.1 Forge support, you would need Loom 1.6.x or earlier
// This module is kept for future compatibility or alternative toolchains

if (isForgeEnabled) {
    architectury {
        platformSetupLoomIde()
        forge()
    }

    configurations {
        common {
            canBeResolved = true
            canBeConsumed = false
        }
        shadowCommon {
            canBeResolved = true
            canBeConsumed = false
        }
        compileClasspath.extendsFrom common
        runtimeClasspath.extendsFrom common
        developmentForge.extendsFrom common
    }

    dependencies {
        forge "net.minecraftforge:forge:${rootProject.forge_version}"
        modApi "dev.architectury:architectury-forge:${rootProject.architectury_version}"

        common(project(path: ":common", configuration: "namedElements")) { transitive false }
        shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive false }
    }

    processResources {
        inputs.property "version", project.version
        inputs.property "mod_id", rootProject.mod_id
        inputs.property "mod_name", rootProject.mod_name
        inputs.property "mod_description", rootProject.mod_description
        inputs.property "mod_author", rootProject.mod_author
        inputs.property "mod_license", rootProject.mod_license
        inputs.property "forge_loader_version", rootProject.findProperty("forge_loader_version") ?: "[47,)"
        inputs.property "minecraft_version_range_forge", rootProject.findProperty("minecraft_version_range_forge") ?: "[1.20.1,1.20.2)"
        inputs.property "architectury_min_version", rootProject.findProperty("architectury_min_version") ?: "9.0.0"

        filesMatching("META-INF/mods.toml") {
            expand(
                "version": project.version,
                "mod_id": rootProject.mod_id,
                "mod_name": rootProject.mod_name,
                "mod_description": rootProject.mod_description,
                "mod_author": rootProject.mod_author,
                "mod_license": rootProject.mod_license,
                "forge_loader_version": rootProject.findProperty("forge_loader_version") ?: "[47,)",
                "minecraft_version_range_forge": rootProject.findProperty("minecraft_version_range_forge") ?: "[1.20.1,1.20.2)",
                "architectury_min_version": rootProject.findProperty("architectury_min_version") ?: "9.0.0"
            )
        }
    }

    shadowJar {
        exclude "architectury.common.json"
        configurations = [project.configurations.shadowCommon]
        archiveClassifier = "dev-shadow"
    }

    remapJar {
        input.set shadowJar.archiveFile
        dependsOn shadowJar
        archiveClassifier = null
    }

    sourcesJar {
        def commonSources = project(":common").sourcesJar
        dependsOn commonSources
        from commonSources.archiveFile.map { zipTree(it) }
    }

    components.java {
        withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
            skip()
        }
    }
} else {
    // Disable all tasks if forge is not enabled
    tasks.configureEach {
        enabled = false
    }
    // Clear source sets
    sourceSets {
        main {
            java.srcDirs = []
            resources.srcDirs = []
        }
    }
}
