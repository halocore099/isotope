name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get version from tag
        id: version
        run: |
          # Extract version from tag (e.g., v0.2.0-beta+1.21.4 -> 0.2.0-beta)
          FULL_TAG=${GITHUB_REF#refs/tags/v}
          VERSION=${FULL_TAG%%+*}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "FULL_TAG=$FULL_TAG" >> $GITHUB_OUTPUT

      - name: Get MC version from gradle.properties
        id: mcversion
        run: |
          MC_VERSION=$(grep "minecraft_version=" gradle.properties | cut -d'=' -f2)
          echo "MC_VERSION=$MC_VERSION" >> $GITHUB_OUTPUT

      - name: Build
        run: ./gradlew build
        env:
          CI_VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Isotope IDE v${{ steps.version.outputs.VERSION }} (MC 1.21.x)
          body: |
            ## Isotope IDE v${{ steps.version.outputs.VERSION }}

            **Minecraft 1.21.x** (1.21 - 1.21.4+)

            Visual loot table editor and worldgen analysis toolkit for modpack developers.

            ### Downloads
            - **Fabric**: `isotope-fabric-${{ steps.version.outputs.VERSION }}.jar`
            - **NeoForge**: `isotope-neoforge-${{ steps.version.outputs.VERSION }}.jar`

            ### Requirements
            - Minecraft 1.21.x
            - Fabric Loader 0.16.0+ or NeoForge 21.x+
            - Architectury API

            See [CHANGELOG.md](https://github.com/halocore099/isotope/blob/main/CHANGELOG.md) for details.
          files: |
            fabric/build/libs/isotope-fabric-*.jar
            neoforge/build/libs/isotope-neoforge-*.jar
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            fabric/build/libs/isotope-fabric-${{ steps.version.outputs.VERSION }}.jar
            neoforge/build/libs/isotope-neoforge-${{ steps.version.outputs.VERSION }}.jar
          name: Isotope IDE v${{ steps.version.outputs.VERSION }}
          version: ${{ steps.version.outputs.VERSION }}+1.21.x
          version-type: beta
          loaders: |
            fabric
            neoforge
          game-versions: ">=1.21 <1.22"
          dependencies: |
            architectury-api | depends | *
            fabric-api | depends | * | fabric

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        if: ${{ secrets.CURSEFORGE_ID != '' }}
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            fabric/build/libs/isotope-fabric-${{ steps.version.outputs.VERSION }}.jar
            neoforge/build/libs/isotope-neoforge-${{ steps.version.outputs.VERSION }}.jar
          name: Isotope IDE v${{ steps.version.outputs.VERSION }}
          version: ${{ steps.version.outputs.VERSION }}+1.21.x
          version-type: beta
          loaders: |
            fabric
            neoforge
          game-versions: ">=1.21 <1.22"
          dependencies: |
            architectury-api | depends | *
            fabric-api | depends | * | fabric
