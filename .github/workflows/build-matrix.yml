name: Multi-Version Build

on:
  push:
    branches: [main, 1.21.x, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew :common:test

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: common/build/reports/tests/
          retention-days: 7

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: common/build/test-results/
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc_version: ['1.21.0', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11']
        loader: ['neoforge', 'fabric']

    name: Build ${{ matrix.loader }} MC ${{ matrix.mc_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.loader }} for MC ${{ matrix.mc_version }}
        run: ./gradlew :${{ matrix.loader }}:build -PmcVersion=${{ matrix.mc_version }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: isotope-${{ matrix.loader }}-mc${{ matrix.mc_version }}
          path: |
            ${{ matrix.loader }}/build/libs/*.jar
            !${{ matrix.loader }}/build/libs/*-dev-shadow.jar
          retention-days: 7
          if-no-files-found: error

  # Summary job that waits for tests and builds
  summary:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Build Summary
        run: |
          echo "## Multi-Version Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "Unit tests: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "Unit tests: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Results" >> $GITHUB_STEP_SUMMARY
          echo "24 builds attempted (12 versions x 2 loaders)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Version | NeoForge | Fabric |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          for v in 1.21.0 1.21.1 1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11; do
            echo "| $v | - | - |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Check for failures
        if: needs.test.result == 'failure' || needs.build.result == 'failure'
        run: |
          echo "Tests or builds failed. Check individual job logs."
          exit 1
