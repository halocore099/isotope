// Use the API version determined by root project based on target MC version
def apiVersion = rootProject.ext.apiVersion

architectury {
    common("neoforge", "fabric")
}

sourceSets {
    main {
        java {
            srcDir "src/main/java"
            srcDir "src/${apiVersion}/java"
        }
        resources {
            srcDir "src/${apiVersion}/resources"
        }
    }
}

dependencies {
    // Fabric loader for annotations (EnvType, Environment) - compile only
    modCompileOnly "net.fabricmc:fabric-loader:0.16.9"
    // Architectury API
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"
}

// Print which API version is being used
tasks.named('compileJava') {
    doFirst {
        println "Compat module: Using API version ${apiVersion} for MC ${mcVersion}"
    }
}

// Handle duplicate entries in sourcesJar (from multiple source sets)
tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
