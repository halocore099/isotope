apply plugin: "com.github.johnrengelman.shadow"

def mcLabel = rootProject.findProperty("minecraft_version_label") ?: rootProject.minecraft_version
archivesBaseName = "isotope-fabric-${mcLabel}"

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mod_id", rootProject.mod_id
    inputs.property "mod_name", rootProject.mod_name
    inputs.property "mod_description", rootProject.mod_description
    inputs.property "mod_author", rootProject.mod_author
    inputs.property "mod_license", rootProject.mod_license
    inputs.property "minecraft_version_range_fabric", rootProject.findProperty("minecraft_version_range_fabric") ?: ">=1.21 <1.22"
    inputs.property "architectury_min_version", rootProject.findProperty("architectury_min_version") ?: "13.0.0"
    inputs.property "java_version", rootProject.findProperty("java_version") ?: "21"

    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "mod_id": rootProject.mod_id,
            "mod_name": rootProject.mod_name,
            "mod_description": rootProject.mod_description,
            "mod_author": rootProject.mod_author,
            "mod_license": rootProject.mod_license,
            "minecraft_version_range_fabric": rootProject.findProperty("minecraft_version_range_fabric") ?: ">=1.21 <1.22",
            "architectury_min_version": rootProject.findProperty("architectury_min_version") ?: "13.0.0",
            "java_version": rootProject.findProperty("java_version") ?: "21"
        )
    }
}

shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
